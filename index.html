<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Визитка — Алексей Белов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* Ambient glow background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 70%, rgba(168, 85, 247, 0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 420px;
      background: linear-gradient(135deg, #13131f 0%, #1a1a2e 100%);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 24px;
      padding: 48px 40px 36px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 32px 80px rgba(0,0,0,0.6),
        0 0 60px rgba(99, 102, 241, 0.08);
      overflow: hidden;
    }

    /* Decorative corner line */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 120px; height: 120px;
      background: conic-gradient(from 180deg at 0 0, rgba(99,102,241,0.3) 0deg, transparent 90deg);
      border-radius: 0 0 100% 0;
    }

    .card::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 80px; height: 80px;
      background: conic-gradient(from 0deg at 100% 100%, rgba(168,85,247,0.25) 0deg, transparent 90deg);
      border-radius: 100% 0 0 0;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(99,102,241,0.4);
      position: relative;
      z-index: 1;
    }

    .name {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .title {
      font-size: 14px;
      font-weight: 500;
      color: #a855f7;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, rgba(99,102,241,0.4) 0%, transparent 100%);
      margin-bottom: 24px;
    }

    .contacts {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #9ca3af;
      font-size: 14px;
      text-decoration: none;
      transition: color 0.2s;
    }

    .contact-item:hover { color: #e5e7eb; }

    .contact-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-icon svg {
      width: 15px;
      height: 15px;
      fill: #6366f1;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 32px;
    }

    .tag {
      padding: 4px 12px;
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      color: #818cf8;
    }

    /* Report button */
    .report-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(99,102,241,0.4);
      position: relative;
      z-index: 1;
    }

    .report-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(99,102,241,0.55);
    }

    .report-btn:active { transform: translateY(0); }

    .report-btn svg {
      width: 18px;
      height: 18px;
      fill: #fff;
      flex-shrink: 0;
    }

    .btn-label-sub {
      font-size: 10px;
      font-weight: 400;
      opacity: 0.75;
      margin-top: 1px;
    }

    .btn-text { display: flex; flex-direction: column; align-items: flex-start; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">АБ</div>
    <div class="name">Алексей Белов</div>
    <div class="title">Crypto Analyst &amp; Web Developer</div>

    <div class="divider"></div>

    <div class="contacts">
      <a class="contact-item" href="mailto:alexey.belov@example.com">
        <span class="contact-icon">

        </span>

      </a>

        </span>
        +7 900 123-45-67

        <span class="contact-icon">
          <svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 2a6 6 0 015.77 4.37l-1.21.48A4 4 0 0010 6a4 4 0 00-4 4 4 4 0 004 4 4 4 0 004-3.37l1.21.48A6 6 0 1110 4zm0 2a2 2 0 110 4 2 2 0 010-4z"/></svg>
        </span>
        t.me/alexey_belov_crypto

    </div>

    <div class="tags">
      <span class="tag">Bitcoin</span>
      <span class="tag">Blockchain</span>
      <span class="tag">DeFi</span>
      <span class="tag">Web3</span>
      <span class="tag">Data Analysis</span>
    </div>

    <a href="bitcoin-report.html" class="report-btn">
      <svg viewBox="0 0 24 24"><path d="M3 3h18v2H3V3zm0 8h18v2H3v-2zm0 8h18v2H3v-2zm6-12l6 4-6 4V7z"/></svg>
      <span class="btn-text">
        <span>Отчёт: Bitcoin за 10 лет</span>
        <span class="btn-label-sub">История цены, взлёты и падения</span>
      </span>
    </a>
  </div>
</body>
</html>
